<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Found</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans', Arial, Helvetica, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.logo{
    width:420px;
    max-width:90%;
    display:block;
    margin:35px auto 25px;
}

hr{
    border:none;
    border-top:1px solid #ddd;
    margin:30px 0;
}

.check{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.badge-icon{
    width:60px;
    height:60px;
}

.title{
    color:#005d12;
    font-size:48px;
    font-weight:700;
    margin:15px 0 10px;
    letter-spacing:-1px;
}

.desc{
    color:#666;
    font-size:20px;
    line-height:1.8;
    max-width:560px;
    margin:12px auto;
}

.card{
    margin-top:40px;
    border:1px solid #0f7ea3;
    padding:50px 40px;
    background:#fff;
}

.name{
    font-size:52px;
    color:#555;
    font-weight:700;
    margin-bottom:25px;
}

.course{
    font-size:36px;
    color:#0a7ea8;
    font-weight:600;
    line-height:1.3;
}

.card-line{
    border:none;
    border-top:2px solid #e5e5e5;
    margin:35px 0 25px;
}

.info{
    text-align:center;
    font-size:18px;
    color:#555;
    line-height:1.9;
}

.info p{
    margin:8px 0;
}

.info strong{
    color:#000;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

    <img class="logo" src="logo.png" alt="Logo">

    <hr>

  <div class="check">
    <img src="badge.png" class="badge-icon" alt="Verified">
</div>

    <div class="title">Certificate Found</div>

    <p class="desc">
        Please check that your certificate matches the information below.
    </p>

    <p class="desc">
        If your certificate does not match, please call
        <strong>(800) 680-3789 ext. 300.</strong>
    </p>

    <div class="card">

        <div class="name">
            Jumadil Jati
        </div>

        <div class="course">
            Hydrogen Sulfide<br>
            Awareness Training
        </div>

        <hr class="card-line">

        <div class="info">
            <p>Certificate #: <strong>260702620431549</strong></p>
            <p>Issue Date: <strong>02/07/2027</strong></p>
        </div>

    </div>

    <div class="footer">
        Certificate Verification
    </div>

</div>

</body>
</html>
