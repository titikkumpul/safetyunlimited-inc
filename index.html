<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Found</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans', Arial, Helvetica, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.logo{
    width:420px;
    max-width:90%;
    display:block;
    margin:35px auto 25px;
}

hr{
    border:none;
    border-top:1px solid #ddd;
    margin:30px 0;
}

.certificate-header{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:18px;
    margin:30px 0;
}

.badge-icon{
    width:55px;
    height:55px;
    margin-top:10px;
}

.title{
    color:#006400;
    font-size:48px;
    font-weight:700;
    line-height:0.95;
    text-align:left;
}

.badge-icon{
    width:80px;
    height:80px;
}

.title{
    color:#005d12;
    font-size:48px;
    font-weight:700;
    margin:15px 0 10px;
    letter-spacing:-1px;
}

.desc{
    color:#666;
    font-size:20px;
    line-height:1.8;
    max-width:560px;
    margin:12px auto;
}

.card{
    margin-top:40px;
    border:1px solid #0f7ea3;
    padding:50px 40px;
    background:#fff;
}

.name{
    font-size:52px;
    color:#555;
    font-weight:700;
    margin-bottom:25px;
}

.course{
    font-size:36px;
    color:#0a7ea8;
    font-weight:600;
    line-height:1.3;
}

.card-line{
    border:none;
    border-top:2px solid #e5e5e5;
    margin:35px 0 25px;
}

.info{
    text-align:center;
    font-size:18px;
    color:#555;
    line-height:1.9;
}

.info p{
    margin:8px 0;
}

.info strong{
    color:#000;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

    <img class="logo" src="logo.png" alt="Logo">

    <hr>

    <div class="certificate-header">

        <img src="badge.png" class="badge-icon" alt="Verified">

        <div class="title">
            Certificate<br>Found
        </div>

    </div>

    <p class="desc">
        Please check that your certificate matches the information below.
    </p>

    <p class="desc">
        If your certificate does not match, please call
        <strong>(800) 680-3789 ext. 300.</strong>
    </p>

    <div class="card">

        <div class="name" id="certificateName">
            Jumadil Jati
        </div>

        <div class="course" id="certificateCourse">
            Hydrogen Sulfide<br>
            Awareness Training
        </div>

        <hr class="card-line">

        <div class="info">
            <p>
                Certificate #: 
                <strong id="certificateNumber">260702620431549</strong>
            </p>

            <p>
                Issue Date: 
                <strong id="certificateDate">02/07/2027</strong>
            </p>
        </div>

    </div>

    <div class="footer">
        Certificate Verification
    </div>

</div>


<script>

/*
===========================================
DATA SERTIFIKAT
===========================================
*/

const certificates = {

    "260702620431549": {
        name: "Jumadil Jati",
        course: "Hydrogen Sulfide<br>Awareness Training",
        date: "02/07/2027"
    },

    "260901620931828": {
        name: "Mislan Raugu",
        course: "Hydrogen Sulfide<br>Awareness Training",
        date: "01/09/2027"
    }

};


/*
===========================================
VERIFIKASI BERDASARKAN QR
===========================================
*/

const urlParams = new URLSearchParams(window.location.search);

const certificateNumber = urlParams.get("cert");

if (certificateNumber && certificates[certificateNumber]) {

    const certificate = certificates[certificateNumber];

    document.getElementById("certificateName").innerHTML =
        certificate.name;

    document.getElementById("certificateCourse").innerHTML =
        certificate.course;

    document.getElementById("certificateNumber").innerHTML =
        certificateNumber;

    document.getElementById("certificateDate").innerHTML =
        certificate.date;

}

</script>

</body>
</html>
