<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Found</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    background:#ffffff;
    font-family:'Open Sans', Arial, Helvetica, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.logo{
    width:280px;
    margin:30px auto;
    display:block;
}

hr{
    border:none;
    border-top:1px solid #ddd;
    margin:30px 0;
}

.check{
    font-size:60px;
    color:#008000;
}

.title{
    color:#008000;
    font-size:56px;
    font-weight:bold;
    margin:10px 0;
}

.desc{
    color:#555;
    font-size:24px;
    line-height:1.6;
}

.card{
    margin-top:40px;
    border:2px solid #1b7f9c;
    padding:40px;
}

.name{
    font-size:60px;
    color:#444;
    font-weight:bold;
}

.course{
    margin-top:20px;
    font-size:42px;
    color:#0078a8;
}

.card-line{
    border:none;
    border-top:2px solid #e5e5e5;
    margin:35px 0 25px;
}

.info{
    text-align:center;
    font-size:20px;
    color:#444;
    line-height:1.8;
}

.info p{
    margin:8px 0;
}

.info strong{
    color:#000;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

    <img class="logo" src="logo.png" alt="Logo">

    <hr>

    <div class="check">✔</div>

    <div class="title">Certificate Found</div>

    <p class="desc">
        Please check that your certificate matches the information below.
    </p>

    <p class="desc">
        If your certificate does not match, please call
        <strong>(800) 680-3789 ext. 300.</strong>
    </p>

    <div class="card">

        <div class="name">
            Jumadil Jati
        </div>

        <div class="course">
            Hydrogen Sulfide<br>
            Awareness Training
        </div>

        <hr class="card-line">

        <div class="info">
            <p>Certificate #: <strong>260702620431549</strong></p>
            <p>Issue Date: <strong>02/07/2027</strong></p>
        </div>

    </div>

    <div class="footer">
        Certificate Verification
    </div>

</div>

</body>
</html>
